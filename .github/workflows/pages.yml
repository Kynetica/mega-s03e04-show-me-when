# Publishes app/ to the gh-pages branch (GitHub Pages serves that branch) and stamps the build sha
# of main into index.html (R6).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build sha and publish to gh-pages
        run: |
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" app/index.html
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "board build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
